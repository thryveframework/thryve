[workspace]
    members = [
        "crates/thryve*",
        "tests",
        "examples/rust",
    ]

    default-members = [
        "crates/thryve*",
    ]

    resolver = "3"

[workspace.package]
    edition = "2024"
    # The oldest Rust that builds Thryve. CI's "Minimum Rust version" job builds with it.
    rust-version = "1.98"
    license = "AGPL-3.0-or-later"
    homepage = "https://thryve-framework.com"
    repository = "https://github.com/thryveframework/thryve"
    readme = "README.md"

[workspace.dependencies]
    windows-services = "0.26.1"
    strum = { version = "0.28.0" , features = ["derive"] }
    strum_macros = "0.28.0"
    chrono = "0.4.44"
    crossbeam = "0.8.4"
    crossbeam-skiplist = "0.1.3"
    ron = "0.12"
    petgraph = {version = "0.8.3" , features = ["serde-1"] }
    serde = { version = "1.0.228" , features = ["derive"] }
    thiserror = "2.0.18"
